name: Django CI

on: [ push ]

jobs:
  django:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydatabase
          POSTGRES_HOST: localhost
        ports:
          - 5432:5432
        # Если требуется, вы можете настроить ожидание
        # чтобы PostgreSQL был доступен перед запуском миграций
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'  # Замените на вашу версию Python
#          cache: 'pip'
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          SECRET_KEY: 3b85o3eg0&(dl_6kz2!21b@snsr5(p#r721nj!ypf-pe4$4$$p
#          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mydatabase
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydatabase
          POSTGRES_HOST: localhost
        run: python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: 3b85o3eg0&(dl_6kz2!21b@snsr5(p#r721nj!ypf-pe4$4$$p
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydatabase
          POSTGRES_HOST: localhost
#          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mydatabase
        run: python manage.py test
